name: oar

services:
  oar:
    build:
      context: .
      secrets:
        - next_key
    container_name: oar
    restart: unless-stopped
    mem_limit: ${OAR_MEMORY_LIMIT:-128MiB}
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-/app/data/oar.db}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
    volumes:
      - oar_data:/app/data
    networks:
      - oar-network
    ports:
      - 8080:8080

volumes:
  oar_data:
    driver: local

secrets:
  next_key:
    environment: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY

networks:
  oar-network:
    driver: bridge
    name: oar-network
