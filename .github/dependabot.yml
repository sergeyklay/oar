version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    versioning-strategy: increase
    target-branch: main
    assignees: [cicdbot]
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    ignore:
      # Plugins in the ESLint 9.x ecosystem do not all support 10 yet.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # TypeScript 7.x is the native Go port with no JavaScript compiler API;
      # typescript-eslint loads it at import time and `npm run lint` exits 2
      # before parsing a file. No typescript-eslint release admits 7.x yet.
      # The tripwire in __tests__/tech-debt/ carries the exit check.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    commit-message:
      prefix: 'chore(deps): '
      prefix-development: 'chore(deps-dev): '
    groups:
      # React majors change rendering semantics and warrant isolated review;
      # @vitejs/plugin-react groups with React because its JSX transform must
      # track the React version under test.
      react-ecosystem:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
          - '@vitejs/plugin-react'
        update-types:
          - minor
          - patch

      # next and eslint-config-next are versioned as one unit; a mismatched
      # pair fails lint.
      next-framework:
        applies-to: version-updates
        patterns:
          - next
          - eslint-config-next
        update-types:
          - minor
          - patch

      # The @radix-ui/react-* packages release in lock-step and have no
      # framework-entangled runtime.
      ui-components:
        applies-to: version-updates
        patterns:
          - '@radix-ui/*'
          - lucide-react
          - class-variance-authority
          - clsx
          - tailwind-merge
          - cmdk
          - sonner
        update-types:
          - minor
          - patch

      # Tailwind v4 keeps its configuration in globals.css, so tailwindcss and
      # its PostCSS plugin can break together.
      tailwind-ecosystem:
        applies-to: version-updates
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
          - tw-animate-css
        update-types:
          - minor
          - patch

      # vitest and @vitest/coverage-v8 peer-pin each other to an exact
      # version, so a major arriving without its coverage package fails
      # `npm ci` at ERESOLVE before any test runs.
      vitest-runner:
        applies-to: version-updates
        patterns:
          - vitest
          - '@vitest/*'
        update-types:
          - major
          - minor
          - patch

      # Deliberately disjoint from vitest-runner: Dependabot assigns a package
      # to the first group it matches, so an overlap here would put vitest
      # majors on this minor/patch-only path.
      testing-toolchain:
        applies-to: version-updates
        patterns:
          - jsdom
          - '@testing-library/*'
          - '@faker-js/faker'
        update-types:
          - minor
          - patch

      # A bad @types/node bump fails typecheck before merging.
      typescript-toolchain:
        applies-to: version-updates
        patterns:
          - typescript
          - '@types/node'
          - tsx
        update-types:
          - minor
          - patch

      # eslint-config-next belongs with next-framework and must move in
      # lock-step with next.
      linting-formatting:
        applies-to: version-updates
        patterns:
          - eslint
          - 'eslint-config-*'
          - prettier
        exclude-patterns:
          - eslint-config-next
        update-types:
          - minor
          - patch

      # Pino and its companion packages share one major version contract.
      pino-logging:
        applies-to: version-updates
        patterns:
          - pino
          - 'pino-*'
        update-types:
          - minor
          - patch

      # drizzle-orm and drizzle-kit share a schema-dialect contract; an
      # isolated bump of either can break `db:push`.
      database:
        applies-to: version-updates
        patterns:
          - drizzle-orm
          - drizzle-kit
          - better-sqlite3
          - '@types/better-sqlite3'
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    target-branch: main
    assignees: [cicdbot]
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: 'chore(deps): '
    ignore:
      # The Node major is pinned in three places that must agree: this base
      # image, node-version in .github/workflows/ci.yml, and nodejs in
      # .tool-versions. Dependabot only sees this one, so a major bump here
      # would ship an image built on a runtime neither CI nor local
      # development uses.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    target-branch: main
    assignees: [cicdbot]
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'ci: '
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
