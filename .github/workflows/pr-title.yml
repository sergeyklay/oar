name: PR Title Generator

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write
  contents: read

jobs:
  rename-pr:
    name: Update PR title
    runs-on: ubuntu-latest

    # Only run for code owners and members to avoid spending tokens on random contributors
    if: |
      startsWith(github.event.pull_request.title, '@cicdbot title') &&
      contains(fromJSON('["OWNER", "MEMBER"]'), github.event.pull_request.author_association)

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} --patch | head -n 500 > /tmp/pr_diff.txt

      - name: Generate PR title with Claude
        id: generate_title
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_VERSION: 2023-06-01
          MODEL: claude-haiku-4-5-20251001
          MAX_TOKENS: 100
          TEMPERATURE: 0.3
          SYSTEM_PROMPT: |
            You are a helpful assistant that generates concise, descriptive pull request titles.

            Follow these rules:

            1. Use conventional commit format: <type>[optional scope]: <description>
            2. Types: feat, fix, refactor, docs, test, chore, style, perf, ci
            3. An optional scope MAY be provided to a commit's type.
            4. A scope MUST consist of a noun describing a section of the codebase surrounded by parenthesis
            4. Keep under 72 characters including type and scope
            5. Be specific and descriptive
            6. Use imperative mood (e.g., 'add' not 'added')
            7. No period at the end
            8. Respond with ONLY the title, no explanations or markdown formatting

            Good examples:

            - chore: cleanup workspace config and refactor agent names
            - feat: implement PR title generation using Claude API
            - feat(auth): add OAuth2 login support
            - fix(api): resolve null pointer exception in user endpoint
            - docs(readme): update installation instructions for clarity

            Bad examples:

            - Added OAuth2 login support. (not imperative, has period)
            - Fixes issue with user endpoint (not specific)
            - Update docs (not descriptive)
        run: |
          PAYLOAD=$(jq -n \
            --arg model "$MODEL" \
            --arg system "$SYSTEM_PROMPT" \
            --rawfile diff /tmp/pr_diff.txt \
            --argjson max_tokens $MAX_TOKENS \
            --argjson temperature $TEMPERATURE \
            '{
              model: $model,
              max_tokens: $max_tokens,
              temperature: $temperature,
              system: $system,
              messages: [{
                role: "user",
                content: ("Based on this git diff, generate an appropriate PR title:\n\n" + $diff)
              }]
            }')

          HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/response.json \
            https://api.anthropic.com/v1/messages \
            -H "Content-Type: application/json" \
            -H "x-api-key: $ANTHROPIC_API_KEY" \
            -H "anthropic-version: $ANTHROPIC_VERSION" \
            -d "$PAYLOAD")

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Claude API request failed with HTTP status $HTTP_CODE"
            exit 1
          fi

          NEW_TITLE=$(jq -r '.content[0].text // empty' /tmp/response.json | head -n1)

          if [ -z "$NEW_TITLE" ]; then
            ERROR_TYPE=$(jq -r '.error.type // "unknown_error"' /tmp/response.json)
            echo "::error::Failed to generate title: $ERROR_TYPE"
            exit 1
          fi

          echo "new_title=$NEW_TITLE" >> $GITHUB_OUTPUT

      - name: Update PR title
        env:
          GH_TOKEN: ${{ secrets.CICDBOT_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --title "${{ steps.generate_title.outputs.new_title }}"

          # Add a comment explaining the change
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "🤖 PR title automatically generated by @cicdbot: **${{ steps.generate_title.outputs.new_title }}**"
