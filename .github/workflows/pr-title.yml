name: PR Title Generator

on:
  pull_request:
    types: [opened]
  pull_request_review_comment:
    types: [created]

permissions:
  pull-requests: write
  contents: read

jobs:
  rename-pr:
    name: Update PR title
    runs-on: ubuntu-latest

    # This will trigger when:
    #
    # - A PR is opened with a title starting with "@cicdbot title"
    # - A review comment is created containing "@cicdbot title"
    #
    # Additionally, only if the PR author is a code owner or member.
    if: |
      (startsWith(github.event.pull_request.title, '@cicdbot title') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@cicdbot title'))) &&
      contains(fromJSON('["OWNER", "MEMBER"]'), github.event.pull_request.author_association)

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prepare inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get PR diff (limit to 2000 lines to stay within token limits)
          gh pr diff ${{ github.event.pull_request.number }} --patch | head -n 2000 > /tmp/pr_diff.txt

          # Extract system prompt from markdown file, stripping YAML front matter
          sed '1{/^---$/!q;};1,/^---$/d' .github/prompts/pr-title.md > /tmp/system_prompt.txt

      - name: Generate PR title with Claude
        id: generate_title
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_VERSION: '2023-06-01'
          # Anthropic's format is claude-{family}-{major}[-{minor}]-{YYYYMMDD}
          MODEL: claude-haiku-4-5-20251001
          MAX_TOKENS: 100
          TEMPERATURE: 0.3
        run: |
          PAYLOAD=$(jq -n \
            --arg model "$MODEL" \
            --rawfile system /tmp/system_prompt.txt \
            --rawfile diff /tmp/pr_diff.txt \
            --argjson max_tokens $MAX_TOKENS \
            --argjson temperature $TEMPERATURE \
            '{
              model: $model,
              max_tokens: $max_tokens,
              temperature: $temperature,
              system: $system,
              messages: [{
                role: "user",
                content: ("Based on this git diff, generate an appropriate PR title:\n\n" + $diff)
              }]
            }')

          HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/response.json \
            https://api.anthropic.com/v1/messages \
            -H "Content-Type: application/json" \
            -H "x-api-key: $ANTHROPIC_API_KEY" \
            -H "anthropic-version: $ANTHROPIC_VERSION" \
            -d "$PAYLOAD")

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Claude API request failed with HTTP status $HTTP_CODE"
            exit 1
          fi

          NEW_TITLE=$(jq -r '.content[0].text // empty' /tmp/response.json | head -n1)

          if [ -z "$NEW_TITLE" ]; then
            ERROR_TYPE=$(jq -r '.error.type // "unknown_error"' /tmp/response.json)
            echo "::error::Failed to generate title: $ERROR_TYPE"
            exit 1
          fi

          echo "new_title=$NEW_TITLE" >> $GITHUB_OUTPUT

      - name: Update PR title
        env:
          GH_TOKEN: ${{ secrets.CICDBOT_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --title "${{ steps.generate_title.outputs.new_title }}"

          # Add a comment explaining the change
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "🤖 PR title automatically generated by @cicdbot: **${{ steps.generate_title.outputs.new_title }}**"
