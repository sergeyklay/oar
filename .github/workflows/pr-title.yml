name: PR Title Generator

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write
  contents: read

jobs:
  rename-pr:
    uses: sortie-ai/shared-workflows/.github/workflows/pr-title.yml@v1.0.0
    with:
      bot-name: cicdbot
      skill-path: .github/skills/pr-naming/SKILL.md
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      bot-token: ${{ secrets.CICDBOT_TOKEN }}
