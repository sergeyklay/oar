name: PR Title Generator

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write
  contents: read

jobs:
  rename-pr:
    # This will trigger when one of the following occurs:
    #
    # - A PR is opened with a title starting with "@cicdbot title"
    #   (restricted to PR author being OWNER or MEMBER)
    # - A comment is created containing "@cicdbot title"
    #   (restricted to commenter being OWNER or MEMBER)
    #
    # Security: Each trigger checks the ACTOR's association, not the PR author's.
    if: |
      (
        github.event_name == 'pull_request' &&
        startsWith(github.event.pull_request.title, '@cicdbot title') &&
        contains(fromJSON('["OWNER", "MEMBER"]'), github.event.pull_request.author_association)
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '@cicdbot title') &&
        contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        startsWith(github.event.review.body, '@cicdbot title') &&
        contains(fromJSON('["OWNER", "MEMBER"]'), github.event.review.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@cicdbot title') &&
        contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association)
      )
    uses: sortie-ai/shared-workflows/.github/workflows/pr-title.yml@v1.0.0
    with:
      bot-name: cicdbot
      skill-path: .github/skills/creating-pr/SKILL.md
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      bot-token: ${{ secrets.CICDBOT_TOKEN }}
