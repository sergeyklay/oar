name: PR Title Generator

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write
  contents: read

env:
  SKILL_DISPLAY_TITLE: 'Oar: PR Title Naming Convention'
  SKILL_SOURCE: 'github_workflow'
  ANTHROPIC_VERSION: '2023-06-01'
  ANTHROPIC_BETA: 'skills-2025-10-02'

jobs:
  rename-pr:
    name: Update PR title
    runs-on: ubuntu-latest

    # This will trigger when one of the following occurs:
    #
    # - A PR is opened with a title starting with "@cicdbot title"
    # - A review comment is created containing "@cicdbot title"
    # - An issue comment is created containing "@cicdbot title"
    # - A PR review is submitted containing "@cicdbot title"
    #
    # Additionally, only if the PR author is a code owner or member.
    if: |
      (
        (
          github.event_name == 'pull_request' &&
          startsWith(github.event.pull_request.title, '@cicdbot title')
        ) ||
        (
          github.event_name == 'issue_comment' &&
          startsWith(github.event.comment.body, '@cicdbot title')
        ) ||
        (
          github.event_name == 'pull_request_review' &&
          startsWith(github.event.review.body, '@cicdbot title')
        ) ||
        (
          github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@cicdbot title')
        )
      ) &&
      contains(fromJSON('["OWNER", "MEMBER"]'), github.event.pull_request.author_association)

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prepare inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get PR diff (limit to 2000 lines to stay within token limits)
          gh pr diff ${{ github.event.pull_request.number }} --patch | head -n 2000 > /tmp/pr_diff.txt

      - name: Ensure Skill exists
        id: ensure-skill
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "Checking if skill exists..."
          HTTP_CODE=$(curl -s "curl -s -w "%{http_code}" -o /tmp/response.json \
            https://api.anthropic.com/v1/skills?source=$SKILL_SOURCE" \
            -H "x-api-key: $ANTHROPIC_API_KEY" \
            -H "anthropic-version: $ANTHROPIC_VERSION" \
            -H "anthropic-beta: $ANTHROPIC_BETA")

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Claude API request failed with HTTP status $HTTP_CODE"
            exit 1
          fi

          SKILL_ID=$(jq -r '.data[] | select(.display_title == "'"$SKILL_DISPLAY_TITLE"'") | .id' /tmp/response.json | head -n1)

          if [ -n "$SKILL_ID" ] && [ "$SKILL_ID" != "null" ]; then
            echo "skill_id=$SKILL_ID" >> $GITHUB_OUTPUT
            echo "✓ Skill already exists: $SKILL_ID"
          else
            echo "Creating skill..."
            cd .github/skills
            zip -r /tmp/pr-naming.zip pr-naming/

            HTTP_CODE=$(curl -s "curl -s -w "%{http_code}" -o /tmp/response.json \
              https://api.anthropic.com/v1/skills \
              -X POST \
              -H "x-api-key: $ANTHROPIC_API_KEY" \
              -H "anthropic-version: $ANTHROPIC_VERSION" \
              -H "anthropic-beta: $ANTHROPIC_BETA" \
              -F "display_title=$SKILL_DISPLAY_TITLE" \
              -F "files[]=@/tmp/pr-naming.zip")

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "::error::Claude API request failed with HTTP status $HTTP_CODE"
              exit 1
            fi

            SKILL_ID=$(jq -r '.id' /tmp/response.json | head -n1)
            if [ -z "$SKILL_ID" ] || [ "$SKILL_ID" == "null" ]; then
              echo "::error::Failed to create skill. Unexpected API response: $(cat /tmp/response.json)"
              exit 1
            fi

            echo "skill_id=$SKILL_ID" >> $GITHUB_OUTPUT
            echo "✓ Created skill: $SKILL_ID"
          fi

      - name: Generate PR title with Claude
        id: generate_title
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Anthropic's format is claude-{family}-{major}[-{minor}]-{YYYYMMDD}
          MODEL: claude-haiku-4-5-20251001
          SKILL_ID: ${{ steps.ensure-skill.outputs.skill_id }}
          MAX_TOKENS: 100
          TEMPERATURE: 0.3
          SYSTEM_PROMPT: |
            ## Role

            You are the Senior Release Engineer of a Fortune 500 tech company.
            You specialize in creating clear, concise, and descriptive Pull Request titles that follow best practices.
            Your reputation depends on quality titles that accurately reflect the changes made in the PR.

            ## Task

            Compose a concise, self-explanatory title that reflects ONLY the main purpose of the Pull Request.
        run: |
          PAYLOAD=$(jq -n \
            --arg model "$MODEL" \
            --arg skill_id "$SKILL_ID" \
            --arg skill_source "$SKILL_SOURCE" \
            --arg system "$SYSTEM_PROMPT" \
            --rawfile diff /tmp/pr_diff.txt \
            --argjson max_tokens $MAX_TOKENS \
            --argjson temperature $TEMPERATURE \
            '{
              model: $model,
              max_tokens: $max_tokens,
              temperature: $temperature,
              system: $system,
              container: {
                skills: [{
                  type: $skill_source,
                  skill_id: $skill_id,
                  version: "latest"
                }]
              },
              messages: [{
                role: "user",
                content: ("Based on this git diff, generate an appropriate PR title:\n\n<diff>\n" + $diff + "\n</diff>")
              }]
            }')

          HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/response.json \
            https://api.anthropic.com/v1/messages \
            -H "Content-Type: application/json" \
            -H "x-api-key: $ANTHROPIC_API_KEY" \
            -H "anthropic-version: $ANTHROPIC_VERSION" \
            -d "$PAYLOAD")

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Claude API request failed with HTTP status $HTTP_CODE"
            exit 1
          fi

          NEW_TITLE=$(jq -r '.content[0].text // empty' /tmp/response.json | head -n1)

          if [ -z "$NEW_TITLE" ]; then
            ERROR_TYPE=$(jq -r '.error.type // "unknown_error"' /tmp/response.json)
            echo "::error::Failed to generate title: $ERROR_TYPE"
            exit 1
          fi

          echo "new_title=$NEW_TITLE" >> $GITHUB_OUTPUT

      - name: Update PR title
        env:
          GH_TOKEN: ${{ secrets.CICDBOT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NEW_TITLE: ${{ steps.generate_title.outputs.new_title }}
          OLD_TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh pr edit "$PR_NUMBER" --title "$NEW_TITLE"
          gh pr comment "$PR_NUMBER" \
            --body "🤖 PR title was updated by `@cicdbot` from **$OLD_TITLE** to **$NEW_TITLE**"
