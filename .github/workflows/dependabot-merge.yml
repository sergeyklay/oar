name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [CI]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    if: ${{ github.event.workflow_run.actor.login == 'dependabot[bot]' || github.event.workflow_run.actor.login == 'dependabot-preview[bot]' }}
    uses: sortie-ai/shared-workflows/.github/workflows/dependabot-merge.yml@v1.0.0
    secrets:
      bot-token: ${{ secrets.CICDBOT_TOKEN }}
